<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Review Summarizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col items-center py-10">

    <div class="w-full max-w-2xl bg-white p-8 rounded-lg shadow-md">
        <h1 class="text-3xl font-bold text-center mb-2 text-blue-600">⭐ AI Review Summarizer</h1>
        <p class="text-center text-gray-500 mb-6">Find out what people really think.</p>

        <div class="flex gap-2 mb-6">
            <input type="text" id="searchInput" placeholder="e.g., Apple Store Chennai" 
                   class="flex-1 p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="analyzeReviews()" id="searchBtn"
                    class="bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-700 transition">
                Analyze
            </button>
        </div>

        <div id="loading" class="hidden text-center text-blue-500 font-medium my-4">
            🤖 Scraping and analyzing reviews... please wait.
        </div>

        <div id="errorBox" class="hidden bg-red-100 text-red-700 p-4 rounded-lg mb-4 text-center"></div>

        <div id="results" class="hidden flex flex-col md:flex-row gap-6 mt-6">
            <div class="flex-1 bg-green-50 p-4 rounded-lg border border-green-200">
                <h2 class="text-xl font-bold text-green-700 mb-3">✅ Pros</h2>
                <ul id="prosList" class="list-disc pl-5 space-y-2 text-green-900"></ul>
            </div>
            
            <div class="flex-1 bg-red-50 p-4 rounded-lg border border-red-200">
                <h2 class="text-xl font-bold text-red-700 mb-3">❌ Cons</h2>
                <ul id="consList" class="list-disc pl-5 space-y-2 text-red-900"></ul>
            </div>
        </div>
    </div>

    <script>
        async function analyzeReviews() {
            const query = document.getElementById('searchInput').value;
            const btn = document.getElementById('searchBtn');
            const loading = document.getElementById('loading');
            const results = document.getElementById('results');
            const errorBox = document.getElementById('errorBox');

            if (!query) return alert("Please enter a business name.");

            // Reset UI
            results.classList.add('hidden');
            errorBox.classList.add('hidden');
            loading.classList.remove('hidden');
            btn.disabled = true;

            try {
                // Call our FastAPI Backend
                const response = await fetch('http://localhost:8000/api/summarize', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "Something went wrong");
                }

                // Populate UI
                document.getElementById('prosList').innerHTML = data.pros.map(p => `<li>${p}</li>`).join('');
                document.getElementById('consList').innerHTML = data.cons.map(c => `<li>${c}</li>`).join('');
                
                results.classList.remove('hidden');

            } catch (error) {
                errorBox.innerText = error.message;
                errorBox.classList.remove('hidden');
            } finally {
                loading.classList.add('hidden');
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
