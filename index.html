<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Review Summarizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col items-center py-10">

    <div class="w-full max-w-3xl bg-white p-8 rounded-lg shadow-md">
        <h1 class="text-3xl font-bold text-center mb-2 text-blue-600">⭐ AI Review Summarizer</h1>
        <p class="text-center text-gray-500 mb-6">Find out what people really think.</p>

        <div class="flex gap-2 mb-6">
            <input type="text" id="searchInput" placeholder="e.g., Apple Store Chennai" 
                   class="flex-1 p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="findLocations()" id="searchBtn"
                    class="bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-blue-700 transition">
                Search
            </button>
        </div>

        <div id="statusMessage" class="hidden text-center text-blue-500 font-medium my-4"></div>
        
        <div id="errorBox" class="hidden bg-red-100 text-red-700 p-4 rounded-lg mb-4 text-center"></div>

        <div id="locationSelector" class="hidden flex flex-col gap-4 mt-4">
            <h2 class="text-lg font-semibold text-gray-700 border-b pb-2">Multiple locations found. Please select one:</h2>
            <div id="cardsContainer" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                </div>
        </div>

        <div id="results" class="hidden mt-6">
            <div id="selectedStoreHeader" class="text-center mb-6 border-b pb-4">
                </div>
            
            <div class="flex flex-col md:flex-row gap-6">
                <div class="flex-1 bg-green-50 p-4 rounded-lg border border-green-200">
                    <h2 class="text-xl font-bold text-green-700 mb-3">✅ Pros</h2>
                    <ul id="prosList" class="list-disc pl-5 space-y-2 text-green-900"></ul>
                </div>
                
                <div class="flex-1 bg-red-50 p-4 rounded-lg border border-red-200">
                    <h2 class="text-xl font-bold text-red-700 mb-3">❌ Cons</h2>
                    <ul id="consList" class="list-disc pl-5 space-y-2 text-red-900"></ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const statusMessage = document.getElementById('statusMessage');
        const errorBox = document.getElementById('errorBox');
        const locationSelector = document.getElementById('locationSelector');
        const cardsContainer = document.getElementById('cardsContainer');
        const results = document.getElementById('results');

        function setStatus(msg) {
            statusMessage.innerText = msg;
            statusMessage.classList.remove('hidden');
            errorBox.classList.add('hidden');
        }

        function clearUI() {
            statusMessage.classList.add('hidden');
            errorBox.classList.add('hidden');
            locationSelector.classList.add('hidden');
            results.classList.add('hidden');
        }

        // --- STEP 1: Find Locations ---
        async function findLocations() {
            const query = searchInput.value;
            if (!query) return alert("Please enter a business name.");

            clearUI();
            setStatus("🔍 Searching Google Maps...");
            searchBtn.disabled = true;

            try {
                const response = await fetch('/api/search_places', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || "Search failed");

                // Render the 3 cards
                cardsContainer.innerHTML = '';
                data.places.forEach(place => {
                    const card = document.createElement('div');
                    // We attach the place data to the button click so we can use it later
                    card.className = "border rounded-lg p-4 hover:shadow-lg cursor-pointer transition bg-white border-blue-200 hover:border-blue-500";
                    card.innerHTML = `
                        <h3 class="font-bold text-gray-800">${place.name}</h3>
                        <p class="text-sm text-gray-500 mt-1 h-10 overflow-hidden">${place.address}</p>
                        <div class="mt-3 flex justify-between text-sm font-semibold text-gray-700">
                            <span>⭐ ${place.rating}</span>
                            <span>📝 ${place.total_ratings} reviews</span>
                        </div>
                    `;
                    // When clicked, run Step 2
                    card.onclick = () => analyzeSpecificPlace(place);
                    cardsContainer.appendChild(card);
                });

                statusMessage.classList.add('hidden');
                locationSelector.classList.remove('hidden');

            } catch (error) {
                errorBox.innerText = error.message;
                errorBox.classList.remove('hidden');
                statusMessage.classList.add('hidden');
            } finally {
                searchBtn.disabled = false;
            }
        }

        // --- STEP 2: Analyze the selected location ---
        async function analyzeSpecificPlace(place) {
            clearUI();
            setStatus(`🤖 Reading reviews for ${place.name}...`);

            try {
                const response = await fetch('/api/summarize', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ place_id: place.place_id })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || "Analysis failed");

                // Populate Header
                document.getElementById('selectedStoreHeader').innerHTML = `
                    <h2 class="text-2xl font-bold text-gray-800">🏪 ${place.name}</h2>
                    <p class="text-gray-500">${place.address}</p>
                    <p class="text-blue-600 font-semibold mt-1">⭐ ${place.rating} (${place.total_ratings} Google Reviews)</p>
                `;

                // Helper function to extract text whether the AI gives us a string or an object
                const extractText = (item) => typeof item === 'object' ? Object.values(item)[0] : item;

                document.getElementById('prosList').innerHTML = data.pros.map(p => `<li>${extractText(p)}</li>`).join('');
                document.getElementById('consList').innerHTML = data.cons.map(c => `<li>${extractText(c)}</li>`).join('');
                
                statusMessage.classList.add('hidden');
                results.classList.remove('hidden');

            } catch (error) {
                errorBox.innerText = error.message;
                errorBox.classList.remove('hidden');
                statusMessage.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
